<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Closet</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="top-buttons">
      <button id="page-switch" class="page-switch">My Favorites</button>
      <button id="images-switch" class="page-switch">The Image Gallery</button>
      <button id="edit-button" class="page-switch edit-button">Edit</button>
    </div>
    <div id="edit-status" class="edit-status" aria-live="polite">
      <span>Editing mode</span>
      <span id="edit-dots" class="edit-dots">.</span>
    </div>
    <main class="app-shell">
      <h1>The Closet</h1>
      <p class="note">Put clothes into the right pile.</p>

      <div class="deck-grid">
        <section class="deck">
          <h2>Shirts</h2>
          <ul id="shirts-list"></ul>
          <form class="item-form" data-deck="shirts">
            <input type="text" placeholder="Type text" />
            <button type="submit">Add</button>
          </form>
        </section>

        <section class="deck">
          <h2>Pants</h2>
          <ul id="pants-list"></ul>
          <form class="item-form" data-deck="pants">
            <input type="text" placeholder="Type text" />
            <button type="submit">Add</button>
          </form>
        </section>

        <section class="deck">
          <h2>Shoes</h2>
          <ul id="shoes-list"></ul>
          <form class="item-form" data-deck="shoes">
            <input type="text" placeholder="Type text" />
            <button type="submit">Add</button>
          </form>
        </section>
      </div>
    </main>

    <div id="image-viewer" class="image-viewer" aria-hidden="true">
      <img id="viewer-image" src="" alt="Full-size clothing item" />
    </div>

    <script src="app.js"></script>
  </body>
</html>
